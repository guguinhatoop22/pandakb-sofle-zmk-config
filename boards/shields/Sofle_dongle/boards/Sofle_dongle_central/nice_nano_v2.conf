### Horizontal SSD1306 on the nice!nano dongle
# Canvas is the panel itself (128x32). Widgets use panel pixels, no rotate_canvas.
CONFIG_NICE_OLED_LANDSCAPE=y
CONFIG_NICE_OLED_CUSTOM_CANVAS_WIDTH=128
CONFIG_NICE_OLED_CUSTOM_CANVAS_HEIGHT=32

CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_WPM=y

# Layout (128x32, left to right):
#   [BT/USB] [profile]  LAYER          Luna
#                       ⇧⌃⌥⌘
# Local battery is drawn off-canvas: the dongle is USB-powered and
# the halves already show their own levels.
CONFIG_NICE_OLED_WIDGET_WPM=y
CONFIG_NICE_OLED_WIDGET_WPM_LUNA=y
CONFIG_NICE_OLED_WIDGET_WPM_BONGO_CAT=n
CONFIG_NICE_OLED_WIDGET_WPM_SPEEDOMETER=n
CONFIG_NICE_OLED_WIDGET_WPM_GRAPH=n
CONFIG_NICE_OLED_WIDGET_WPM_NUMBER=n
CONFIG_NICE_OLED_WIDGET_LAYER=y
CONFIG_NICE_OLED_WIDGET_HID_INDICATORS=n
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS=y
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_FIXED=y
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_FIXED_SYMBOL=y
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_FIXED_HOR=y
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_FIXED_SYMBOL_WINDOWS=y

# Output / profile (left column)
CONFIG_NICE_OLED_WIDGET_OUTPUT_USB_CUSTOM_X=0
CONFIG_NICE_OLED_WIDGET_OUTPUT_USB_CUSTOM_Y=1
CONFIG_NICE_OLED_WIDGET_OUTPUT_BT_CUSTOM_X=0
CONFIG_NICE_OLED_WIDGET_OUTPUT_BT_CUSTOM_Y=0
CONFIG_NICE_OLED_WIDGET_OUTPUT_BT_UNBONDED_CUSTOM_X=0
CONFIG_NICE_OLED_WIDGET_OUTPUT_BT_UNBONDED_CUSTOM_Y=0
CONFIG_NICE_OLED_WIDGET_PROFILE_TEXT_CUSTOM_X=16
CONFIG_NICE_OLED_WIDGET_PROFILE_TEXT_CUSTOM_Y=1
CONFIG_NICE_OLED_WIDGET_PROFILE_CUSTOM_X=16
CONFIG_NICE_OLED_WIDGET_PROFILE_CUSTOM_Y=12
CONFIG_NICE_OLED_WIDGET_BATTERY_CUSTOM_X=0
CONFIG_NICE_OLED_WIDGET_BATTERY_CUSTOM_Y=64

# Layer name (16px font)
CONFIG_NICE_OLED_WIDGET_LAYER_CUSTOM_X=28
CONFIG_NICE_OLED_WIDGET_LAYER_CUSTOM_Y=0

# Modifier icons 14x14, 2px gap → 62px wide
CONFIG_NICE_OLED_WIDGET_MODIFIERS_CUSTOM_X=28
CONFIG_NICE_OLED_WIDGET_MODIFIERS_CUSTOM_Y=17

# Luna 32x22 horizontal, flush right. WPM is counted on the central, so she
# reacts to both halves.
CONFIG_NICE_OLED_WIDGET_LUNA_CUSTOM_X=96
CONFIG_NICE_OLED_WIDGET_LUNA_CUSTOM_Y=10
